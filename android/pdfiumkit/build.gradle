plugins {
    id "com.android.library"
}

android {
    namespace "com.pdfiumkit"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    def repoRoot = rootProject.projectDir.parentFile.parentFile
    def headersDir = new File(repoRoot, "src-android/pdfium/public")
    def libsDir = new File(repoRoot, "out/android/release/lib")

    buildFeatures { buildConfig = true }

    packagingOptions { jniLibs { useLegacyPackaging = false } }

    sourceSets { main { jniLibs.srcDirs = [] } }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig.externalNativeBuild.cmake.arguments += [
            "-DPDFIUM_HEADERS_DIR=${headersDir.absolutePath}",
            "-DPDFIUM_LIB_DIR=${libsDir.absolutePath}"
    ]
}

dependencies {
}
